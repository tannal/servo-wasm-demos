<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>First-Class Wasm Reactive Demo</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --accent: #89b4fa;
      --primary: #a6e3a1;
      --secondary: #fab387;
      --text: #cdd6f4;
      --subtext: #a6adc8;
    }

    body {
      margin: 0;
      padding: 40px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    .wasm-card {
      background: var(--card-bg);
      border: 1px solid #313244;
      border-radius: 16px;
      padding: 32px;
      width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .subtitle {
      color: var(--subtext);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .counter-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      background: #11111b;
      padding: 16px;
      border-radius: 12px;
    }

    .counter-badge {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary);
      min-width: 60px;
      text-align: center;
    }

    .btn {
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn:hover {
      transform: scale(1.04);
    }

    .btn-primary {
      background: var(--primary);
      color: #11111b;
    }

    .btn-secondary {
      background: #313244;
      color: var(--text);
    }

    .btn-accent {
      background: var(--accent);
      color: #11111b;
      width: 100%;
      margin-bottom: 12px;
    }

    .task-card {
      background: #313244;
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .log-section {
      margin-top: 24px;
      border-top: 1px solid #313244;
      padding-top: 16px;
    }

    .log-section h3 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      color: var(--subtext);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-item {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--subtext);
      padding: 4px 0;
      border-bottom: 1px solid #1e1e2e;
    }
  </style>
</head>

<body>
  <button style="color: red;" onclick="onClick()">change the color</button>

  <div id="todo-app-root"></div>
  
  <script type="wasm-component" src="wasm_guest.wasm"></script>
  <script>
    function onClick() {
      const element = document.querySelector('#todo-list-container');
      if (element) {
        element.style.backgroundColor = 'red';
      }
    }
  </script>
</body>

</html>
