<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>First-Class Wasm Reactive Demo</title>

<body>
  <button style="color: red;" onclick="onClick()">change the color</button>

  <div id="todo-app-root"></div>
  
  <script type="wasm-component" src="wasm_guest.wasm"></script>
  <script>
    function onClick() {
      const element = document.querySelector('#todo-list-container');
      if (element) {
        element.style.backgroundColor = 'red';
      }
    }
  </script>
</body>

</html>
