[package]
name = "wasm_guest"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus-core", "dep:dioxus-core-macro", "dep:dioxus-signals", "dep:dioxus-hooks", "dep:dioxus-html"]


[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

# Dioxus 0.6 dependencies (optional, enabled by feature "dioxus")
dioxus-core = { version = "0.6.3", default-features = false, optional = true }
dioxus-core-macro = { version = "0.6.2", optional = true }
dioxus-signals = { version = "0.6.2", default-features = false, optional = true }
dioxus-hooks = { version = "0.6.2", default-features = false, optional = true }
dioxus-html = { version = "0.6.2", default-features = false, optional = true }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "component:wasm-guest"

[package.metadata.component.dependencies]